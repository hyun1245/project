<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue.js 서버</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    #app {
      width: 100%;
      max-width: 600px;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 40px;
      text-align: center;
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 2.5em;
    }
    
    p {
      color: #666;
      font-size: 1.1em;
      margin-bottom: 30px;
    }
    
    .input-group {
      margin-bottom: 20px;
    }
    
    input {
      width: 100%;
      padding: 12px;
      font-size: 1em;
      border: 2px solid #ddd;
      border-radius: 8px;
      transition: border-color 0.3s;
    }
    
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
      margin-bottom: 10px;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    .info-box {
      background: #f0f4ff;
      border-left: 4px solid #667eea;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      text-align: left;
    }
    
    .info-box h3 {
      color: #667eea;
      margin-bottom: 10px;
    }
    
    .info-box p {
      margin: 5px 0;
      font-size: 0.95em;
      text-align: left;
    }
    
    .list-item {
      background: white;
      border: 1px solid #ddd;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .list-item button {
      width: auto;
      padding: 5px 15px;
      font-size: 0.9em;
      margin: 0;
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <h1>🚀 Vue.js 서버</h1>
      <p>환영합니다!</p>
      
      <div class="input-group">
        <input 
          v-model="newItem" 
          @keyup.enter="addItem"
          placeholder="할일을 입력하세요..."
          type="text"
        >
      </div>
      
      <button @click="addItem">추가</button>
      <button @click="fetchStatus">상태 확인</button>
      
      <div v-if="status" class="info-box">
        <h3>서버 상태</h3>
        <p>{{ status }}</p>
      </div>
      
      <div v-if="items.length > 0" class="info-box">
        <h3>할일 목록 ({{ items.length }}개)</h3>
        <div v-for="(item, index) in items" :key="index" class="list-item">
          <span>{{ item }}</span>
          <button @click="removeItem(index)">삭제</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          newItem: '',
          items: [],
          status: ''
        }
      },
      methods: {
        addItem() {
          if (this.newItem.trim()) {
            this.items.push(this.newItem);
            this.newItem = '';
          }
        },
        removeItem(index) {
          this.items.splice(index, 1);
        },
        async fetchStatus() {
          try {
            const response = await fetch('/api/status');
            const data = await response.json();
            this.status = '✅ ' + data.status;
          } catch (error) {
            this.status = '❌ 서버 연결 실패';
          }
        }
      },
      mounted() {
        this.fetchStatus();
      }
    }).mount('#app');
  </script>
</body>
</html>
